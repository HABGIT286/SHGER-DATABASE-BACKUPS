
name: Business Library Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - bot.py
      - requirements.txt
      - index.html
      - 1.jpg
      - books.json
      - library_files/**
      - .github/workflows/library-bot.yml
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: read

concurrency:
  group: business-library-bot
  cancel-in-progress: true

jobs:
  run-library-bot:
    name: Start Library Bot
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TOKKEN: ${{ secrets.TOKKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
      GROUP_LINK: ${{ vars.GROUP_LINK }}
      SITE_URL: ${{ vars.SITE_URL }}
      PORT: "8000"
      DATA_DIR: ${{ github.workspace }}/data
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Baghdad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secrets
        run: |
          test -n "$TOKKEN" || exit 1
          test -n "$GH_TOKEN" || exit 1
          test -n "$ADMIN_ID" || exit 1
          test -n "$ADMIN_CODE" || exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram fastapi uvicorn httpx

      - name: Check Python syntax
        run: python -m py_compile bot.py

      - name: Start bot
        run: python bot.py
