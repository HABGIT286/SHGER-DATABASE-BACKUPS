name: Run Telegram Library Bot


on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule uses UTC. Runs approximately every 6 hours.
    - cron: '0 */6 * * *'

permissions:
  contents: read


concurrency:
  group: telegram-library-bot-polling
  cancel-in-progress: false

jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    # GitHub-hosted runners have a finite runtime. This job stops before the 6-hour limit.
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify required secrets are present
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: |
          test -n "$TOKKEN" || (echo "Missing repository secret: TOKKEN" && exit 1)
          test -n "$ADMIN_ID" || (echo "Missing repository secret: ADMIN_ID" && exit 1)
          test -n "$ADMIN_CODE" || (echo "Missing repository secret: ADMIN_CODE" && exit 1)

      - name: Start bot polling and local API
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          GROUP_LINK: ${{ secrets.GROUP_LINK }}
          DB_PATH: ${{ github.workspace }}/data/library.sqlite3
          LOG_LEVEL: INFO
        run: uvicorn bot:app --host 127.0.0.1 --port 8000 --log-level info
