
name: Validate Business Library

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Telegram token
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import urllib.request

          token = os.getenv("TOKKEN", "").strip()

          if not token:
              print("TOKKEN secret is missing.")
              sys.exit(1)

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/getMe"
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)

          if not data.get("ok"):
              sys.exit("Telegram token validation failed.")

          print("Telegram token is valid.")
          print("Bot username:", data["result"].get("username"))
          PY

      - name: Check Python syntax
        run: python -m py_compile bot.py
