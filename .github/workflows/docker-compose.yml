name: تشغيل مكتبة الأعمال والبوت

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: business-library-runtime
  cancel-in-progress: true

jobs:
  run-library:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: تنزيل ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: تشغيل الموقع والبوت معاً
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          GROUP_LINK: ${{ vars.GROUP_LINK }}
          SITE_URL: ${{ vars.SITE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$TOKKEN" ]; then
            echo "ERROR: Secret TOKKEN is missing."
            exit 1
          fi
          if [ -z "$ADMIN_ID" ]; then
            echo "ERROR: Secret ADMIN_ID is missing."
            exit 1
          fi
          if [ -z "$ADMIN_CODE" ]; then
            echo "ERROR: Secret ADMIN_CODE is missing."
            exit 1
          fi
          echo "Starting FastAPI app and Telegram bot through bot.py..."
          exec uvicorn bot:app --host 0.0.0.0 --port 8000
