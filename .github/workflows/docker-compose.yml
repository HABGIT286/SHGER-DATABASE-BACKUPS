name: Business Library Bot + Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: business-library-single-instance
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run FastAPI and Telegram bot
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          GROUP_LINK: ${{ vars.GROUP_LINK }}
          SITE_URL: ${{ vars.SITE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          test -n "$TOKKEN" || (echo "Missing secret TOKKEN" && exit 1)
          test -n "$ADMIN_ID" || (echo "Missing secret ADMIN_ID" && exit 1)
          test -n "$ADMIN_CODE" || (echo "Missing secret ADMIN_CODE" && exit 1)
          python bot.py
