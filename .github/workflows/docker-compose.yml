
name: Business Library Bot

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: business-library-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        run: |
          test -f bot.py
          test -f index.html
          echo "Project files verified."

      - name: Start Telegram Bot
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          GROUP_LINK: ${{ vars.GROUP_LINK }}
          SITE_URL: ${{ vars.SITE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python bot.py
