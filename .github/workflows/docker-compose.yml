name: Business Library Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: THREHRMBOT-ONE-INSTANCE
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install aiogram fastapi uvicorn httpx

      - name: Verify Secrets
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: |
          if [ -z "$TOKKEN" ]; then
            echo "ERROR: TOKKEN is missing"
            exit 1
          fi

          if [ -z "$ADMIN_ID" ]; then
            echo "ERROR: ADMIN_ID is missing"
            exit 1
          fi

          if [ -z "$ADMIN_CODE" ]; then
            echo "ERROR: ADMIN_CODE is missing"
            exit 1
          fi

          echo "Secrets verified successfully."

      - name: Verify Python Syntax
        run: |
          python -m py_compile bot.py
          echo "bot.py syntax is valid."

      - name: Verify Installed Libraries
        run: |
          python -c "import aiogram, fastapi, uvicorn, httpx; print('All libraries installed successfully')"

      - name: Start Telegram Bot and Website
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          GROUP_LINK: ${{ vars.GROUP_LINK }}
          SITE_URL: ${{ vars.SITE_URL }}
          PORT: "8000"
        run: |
          python bot.py
