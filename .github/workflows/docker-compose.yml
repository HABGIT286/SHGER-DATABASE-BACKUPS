
name: Run Library Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: library-bot-instance
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Stop previous workflow
        run: echo "Previous workflow runs in this group will be cancelled."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram fastapi uvicorn

      - name: Validate bot.py
        run: |
          python -m py_compile bot.py

      - name: Run bot and website
        env:
          TOKKEN: ${{ secrets.TOKKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          GROUP_LINK: ${{ vars.GROUP_LINK }}
          SITE_URL: ${{ vars.SITE_URL }}
          PORT: "8000"
        run: |
          python bot.py
