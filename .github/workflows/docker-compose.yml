name: Business Library Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  paths:
    - 'bot.py'
    - 'requirements.txt'
    - 'static/**'
    - '.github/workflows/library-bot.yml'
  schedule:
    # GitHub-hosted runners have a finite job duration; restart periodically.
    - cron: '0 */5 * * *'

permissions:
  contents: read


concurrency:
  group: business-library-bot
  cancel-in-progress: true


jobs:
  run-library-bot:
    name: Start library API and Telegram polling
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKKEN: ${{ secrets.TOKKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID || vars.ADMIN_ID }}
      ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
      GROUP_LINK: ${{ vars.GROUP_LINK || secrets.GROUP_LINK }}
      SITE_URL: ${{ vars.SITE_URL }}
      PORT: '8000'
      DATA_DIR: ${{ github.workspace }}/data
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Baghdad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Validate required Actions secrets and variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKKEN" || { echo 'Missing TOKKEN secret'; exit 1; }
          test -n "$ADMIN_ID" || { echo 'Missing ADMIN_ID secret or variable'; exit 1; }
          test -n "$ADMIN_CODE" || { echo 'Missing ADMIN_CODE secret'; exit 1; }
          test -n "$GROUP_LINK" || { echo 'Missing GROUP_LINK variable or secret'; exit 1; }
          test -n "$SITE_URL" || { echo 'Missing SITE_URL variable'; exit 1; }
          case "$ADMIN_ID" in
            *[!0-9]*|'') echo 'ADMIN_ID must be a numeric Telegram user ID'; exit 1 ;;
          esac

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Telegram bot and web API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          echo 'Launching library application; bot startup notification is handled by bot.py after Telegram validation.'
          python bot.py
