
name: Madarek Auto Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: madarek-auto-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Detect failure and restore bot
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TOKENN: ${{ secrets.TOKENN }}
          ID_TELE: ${{ secrets.ID_TELE }}
          WELCOME_IMAGE: ${{ secrets.WELCOME_IMAGE }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          GH_TOKEN = os.environ["GH_TOKEN"].strip()
          TG_TOKEN = os.environ.get("TOKENN", "").strip()
          ADMIN_ID = os.environ.get("ID_TELE", "").strip()
          LOGO = os.environ.get("WELCOME_IMAGE", "").strip()
          REPO = os.environ["REPOSITORY"].strip()

          TARGET = "library.yml"
          MAX_ATTEMPTS = 3
          MAX_AGE_MINUTES = 45

          API = "https://api.github.com"
          HEADERS = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Madarek-Auto-Recovery"
          }

          def utc_now():
              return datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          def gh(path, method="GET"):
              req = urllib.request.Request(
                  f"{API}/repos/{REPO}/{path}",
                  headers=HEADERS,
                  method=method
              )
              with urllib.request.urlopen(req, timeout=30) as res:
                  raw = res.read().decode("utf-8", errors="replace")
                  return res.status, json.loads(raw) if raw.strip() else {}

          def telegram(text):
              if not TG_TOKEN or not ADMIN_ID:
                  print("Telegram secrets missing.")
                  return

              endpoint = "sendPhoto" if LOGO else "sendMessage"
              payload = {"chat_id": ADMIN_ID}

              if LOGO:
                  payload["photo"] = LOGO
                  payload["caption"] = text[:1000]
              else:
                  payload["text"] = text

              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{TG_TOKEN}/{endpoint}",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=25) as res:
                      result = json.loads(res.read().decode())
                      print("Telegram sent:", result.get("ok"))
              except Exception as e:
                  print("Telegram error:", type(e).__name__, str(e))

          def report(title, body):
              message = (
                  f"{title}\n\n"
                  "🛡️ MADAREK AUTO RECOVERY\n"
                  "━━━━━━━━━━━━━━━━━━\n"
                  f"{body}\n"
                  "━━━━━━━━━━━━━━━━━━\n"
                  f"🕒 {utc_now()}"
              )
              print(message)
              telegram(message)

          if not GH_TOKEN:
              print("GH_TOKEN is missing.")
              sys.exit(1)

          print("Recovery monitor started:", utc_now())

          # Read recent runs of the main workflow.
          try:
              _, data = gh(
                  f"actions/workflows/{TARGET}/runs?per_page=10"
              )
          except Exception as e:
              report(
                  "🚨 GITHUB CHECK FAILED",
                  f"تعذر فحص تشغيل البوت.\n"
                  f"الخطأ: {type(e).__name__}: {str(e)[:300]}"
              )
              sys.exit(1)

          runs = data.get("workflow_runs", [])

          if not runs:
              report(
                  "🚨 BOT WORKFLOW NOT FOUND",
                  f"لم يتم العثور على تشغيل للملف:\n{TARGET}"
              )
              sys.exit(1)

          run = runs[0]
          run_id = run["id"]
          status = run.get("status")
          conclusion = run.get("conclusion")
          attempt = int(run.get("run_attempt", 1))
          run_url = run.get("html_url", "")
          created_at = run.get("created_at", "")

          print("Run ID:", run_id)
          print("Status:", status)
          print("Conclusion:", conclusion)
          print("Attempt:", attempt)

          # Active or queued run: do not start another.
          if status in ("in_progress", "queued"):
              print("Bot workflow is active. No action.")
              sys.exit(0)

          # Successful run: no recovery needed.
          if status == "completed" and conclusion == "success":
              print("Latest run succeeded.")
              sys.exit(0)

          # Only recover these failure states.
          if status != "completed" or conclusion not in (
              "failure", "cancelled", "timed_out"
          ):
              print("No recovery action required.")
              sys.exit(0)

          # Ignore old failures.
          try:
              created = datetime.fromisoformat(
                  created_at.replace("Z", "+00:00")
              )
              age = (
                  datetime.now(timezone.utc) - created
              ).total_seconds() / 60
          except Exception:
              age = 999999

          if age > MAX_AGE_MINUTES:
              report(
                  "⚠️ RECOVERY WINDOW EXPIRED",
                  f"اكتشاف تشغيل فاشل قديم.\n"
                  f"Workflow: {TARGET}\n"
                  f"Run ID: {run_id}\n"
                  f"الحالة: {conclusion}\n"
                  f"لم تتم إعادة التشغيل بسبب تجاوز "
                  f"{MAX_AGE_MINUTES} دقيقة.\n"
                  f"{run_url}"
              )
              sys.exit(0)

          # Stop when retry limit has been reached.
          if attempt >= MAX_ATTEMPTS:
              report(
                  "🛑 RECOVERY RETRY LIMIT",
                  f"وصل التشغيل إلى حد المحاولات.\n"
                  f"Workflow: {TARGET}\n"
                  f"Run ID: {run_id}\n"
                  f"Attempts: {attempt}/{MAX_ATTEMPTS}\n"
                  f"Conclusion: {conclusion}\n"
                  f"{run_url}"
              )
              sys.exit(0)

          # Notify administration before attempting recovery.
          report(
              "🚨 BOT FAILURE DETECTED",
              f"تم اكتشاف فشل في تشغيل البوت.\n\n"
              f"📄 Workflow: {TARGET}\n"
              f"🆔 Run ID: {run_id}\n"
              f"❌ الحالة: {conclusion}\n"
              f"🔢 المحاولة السابقة: {attempt}/{MAX_ATTEMPTS}\n"
              f"🔄 يتم طلب إعادة التشغيل الآن.\n"
              f"{run_url}"
          )

          # Ask GitHub to rerun the failed workflow.
          try:
              code, _ = gh(
                  f"actions/runs/{run_id}/rerun",
                  method="POST"
              )
              print("Rerun request accepted. HTTP:", code)

          except urllib.error.HTTPError as e:
              details = e.read().decode("utf-8", errors="replace")
              report(
                  "❌ RESTART REQUEST FAILED",
                  f"تعذر إرسال طلب إعادة التشغيل.\n"
                  f"HTTP: {e.code}\n"
                  f"Details: {details[:500]}\n"
                  f"{run_url}"
              )
              sys.exit(1)

          except Exception as e:
              report(
                  "❌ RECOVERY REQUEST ERROR",
                  f"{type(e).__name__}: {str(e)[:500]}\n"
                  f"{run_url}"
              )
              sys.exit(1)

          # Wait and verify the new attempt.
          print("Waiting for the new run to start...")

          recovered = False
          new_attempt = attempt + 1

          for _ in range(18):
              time.sleep(5)

              try:
                  _, updated = gh(f"actions/runs/{run_id}")
                  new_attempt = int(updated.get("run_attempt", attempt))
                  new_status = updated.get("status")
                  new_conclusion = updated.get("conclusion")

                  print(
                      "Verification:",
                      new_attempt,
                      new_status,
                      new_conclusion
                  )

                  if new_attempt > attempt and new_status == "completed":
                      if new_conclusion == "success":
                          recovered = True
                          break
                      else:
                          break

                  if new_attempt > attempt and new_status == "in_progress":
                      break

              except Exception as e:
                  print("Verification error:", type(e).__name__)

          if recovered:
              report(
                  "✅ BOT RESTORED SUCCESSFULLY",
                  f"تمت إعادة تشغيل البوت بنجاح.\n\n"
                f"📄 Workflow: {TARGET}\n"
                f"🆔 Run ID: {run_id}\n"
                f"🔢 Attempt: {new_attempt}\n"
                f"🟢 النتيجة: SUCCESS\n"
                f"🔗 {run_url}"
            )
          else:
              report(
                  "🔄 RECOVERY IN PROGRESS",
                  f"تم إرسال طلب إعادة التشغيل، لكن لم يتم "
                  f"تأكيد النجاح خلال فترة التحقق.\n\n"
                  f"📄 Workflow: {TARGET}\n"
                  f"🆔 Run ID: {run_id}\n"
                  f"🔢 المحاولة: {attempt + 1}/{MAX_ATTEMPTS}\n"
                  f"يرجى متابعة حالة التشغيل في GitHub Actions.\n"
                  f"🔗 {run_url}"
            )

          PY
