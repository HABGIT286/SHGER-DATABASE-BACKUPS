
name: Madarek Library Recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: madarek-recovery-monitor
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check bot and recover if failed
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TOKENN: ${{ secrets.TOKENN }}
          ID_TELE: ${{ secrets.ID_TELE }}
          WELCOME_IMAGE: ${{ secrets.WELCOME_IMAGE }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import sys
          from datetime import datetime, timezone

          GH_TOKEN = os.environ.get("GH_TOKEN", "").strip()
          TG_TOKEN = os.environ.get("TOKENN", "").strip()
          ADMIN_ID = os.environ.get("ID_TELE", "").strip()
          LOGO = os.environ.get("WELCOME_IMAGE", "").strip()
          REPO = os.environ.get("REPOSITORY", "").strip()

          WORKFLOW_FILE = "library-bot.yml"
          MAX_ATTEMPTS = 3
          MAX_AGE_MINUTES = 45

          if not GH_TOKEN or not REPO:
              print("Missing GH_TOKEN or REPOSITORY.")
              sys.exit(1)

          GH_API = "https://api.github.com"
          GH_HEADERS = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Madarek-Recovery"
          }

          def github_request(path, method="GET"):
              req = urllib.request.Request(
                  f"{GH_API}/repos/{REPO}/{path}",
                  headers=GH_HEADERS,
                  method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read().decode("utf-8", errors="replace")
                  return response.status, json.loads(raw) if raw.strip() else {}

          def telegram_send(text):
              if not TG_TOKEN or not ADMIN_ID:
                  print("Telegram secrets missing; notification skipped.")
                  return

              base = f"https://api.telegram.org/bot{TG_TOKEN}"

              try:
                  if LOGO:
                      payload = {
                          "chat_id": ADMIN_ID,
                          "photo": LOGO,
                          "caption": text
                      }
                      endpoint = "sendPhoto"
                  else:
                      payload = {
                          "chat_id": ADMIN_ID,
                          "text": text
                      }
                      endpoint = "sendMessage"

                  req = urllib.request.Request(
                      f"{base}/{endpoint}",
                      data=json.dumps(payload).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST"
                  )

                  with urllib.request.urlopen(req, timeout=25) as response:
                      result = json.loads(response.read().decode())
                      print("Telegram notification:", result.get("ok"))

              except Exception as exc:
                  print("Telegram notification failed:", type(exc).__name__)

          def now():
              return datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          def alert(title, details):
              message = (
                  f"{title}\n\n"
                  f"🛡️ Madarek Recovery System\n"
                  f"━━━━━━━━━━━━━━━━━━\n"
                  f"{details}\n"
                  f"━━━━━━━━━━━━━━━━━━\n"
                  f"🕒 {now()}"
              )
              print(message)
              telegram_send(message)

          print("MADAREK RECOVERY STARTED")
          print("Repository:", REPO)
          print("Time:", now())

          # Get the latest workflow runs.
          try:
              _, data = github_request(
                  f"actions/workflows/{WORKFLOW_FILE}/runs?per_page=5"
              )
          except Exception as exc:
              alert(
                  "🚨 RECOVERY MONITOR ERROR",
                  f"تعذر الوصول إلى GitHub Actions.\n"
                  f"الخطأ: {type(exc).__name__}"
              )
              sys.exit(1)

          runs = data.get("workflow_runs", [])

          if not runs:
              alert(
                  "⚠️ BOT RUN NOT FOUND",
                  f"لم يتم العثور على تشغيل للملف:\n"
                  f"📄 {WORKFLOW_FILE}\n"
                  f"📦 Repository: {REPO}"
              )
              sys.exit(1)

          run = runs[0]
          run_id = run.get("id")
          status = run.get("status")
          conclusion = run.get("conclusion")
          attempt = int(run.get("run_attempt", 1))
          run_url = run.get("html_url", "")
          created_at = run.get("created_at", "")

          print("Latest run ID:", run_id)
          print("Status:", status)
          print("Conclusion:", conclusion)
          print("Attempt:", attempt)

          # Workflow is running. Do not interfere.
          if status in ("in_progress", "queued"):
              print("Bot workflow is active. No action needed.")
              sys.exit(0)

          # Bot workflow completed successfully.
          if status == "completed" and conclusion == "success":
              print("Bot workflow succeeded.")
              sys.exit(0)

          # Recover only recognized failure states.
          if status != "completed" or conclusion not in (
              "failure", "cancelled", "timed_out"
          ):
              print("No recovery action required.")
              sys.exit(0)

          # Avoid recovering an old failure.
          try:
              created = datetime.fromisoformat(
                  created_at.replace("Z", "+00:00")
              )
              age = (
                  datetime.now(timezone.utc) - created
              ).total_seconds() / 60
          except Exception:
              age = 999999

          if age > MAX_AGE_MINUTES:
              alert(
                  "⚠️ RECOVERY EXPIRED",
                  f"اكتشاف تشغيل فاشل قديم.\n\n"
                  f"📄 Workflow: {WORKFLOW_FILE}\n"
                  f"🆔 Run ID: {run_id}\n"
                  f"❌ الحالة: {conclusion}\n"
                  f"لم تتم إعادة التشغيل لأن عمر الفشل تجاوز "
                  f"{MAX_AGE_MINUTES} دقيقة.\n"
                  f"🔗 {run_url}"
              )
              sys.exit(0)

          # Stop automatic recovery after the retry limit.
          if attempt >= MAX_ATTEMPTS:
              alert(
                  "🛑 RECOVERY LIMIT REACHED",
                  f"وصل التشغيل إلى الحد الأقصى للمحاولات.\n\n"
                  f"📄 Workflow: {WORKFLOW_FILE}\n"
                  f"🆔 Run ID: {run_id}\n"
                  f"🔢 Attempts: {attempt}/{MAX_ATTEMPTS}\n"
                  f"❌ الحالة: {conclusion}\n"
                  f"🔗 {run_url}"
              )
              sys.exit(0)

          # Request GitHub Actions to rerun the failed workflow.
          try:
              code, _ = github_request(
                  f"actions/runs/{run_id}/rerun",
                  method="POST"
              )

              alert(
                  "🔄 MADAREK — RECOVERY REQUESTED",
                  f"تم اكتشاف فشل في تشغيل البوت.\n"
                  f"تم إرسال طلب إعادة تشغيل إلى GitHub Actions.\n\n"
                  f"📄 الملف: {WORKFLOW_FILE}\n"
                  f"🆔 Run ID: {run_id}\n"
                  f"🔢 المحاولة السابقة: {attempt}/{MAX_ATTEMPTS}\n"
                  f"⚠️ الحالة السابقة: {conclusion}\n"
                  f"📡 HTTP: {code}\n"
                  f"🔗 متابعة التشغيل:\n{run_url}"
              )

          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")

              alert(
                  "🚨 RECOVERY REQUEST FAILED",
                  f"فشل طلب إعادة التشغيل.\n\n"
                  f"📄 Workflow: {WORKFLOW_FILE}\n"
                  f"🆔 Run ID: {run_id}\n"
                  f"HTTP: {exc.code}\n"
                  f"Details: {body[:800]}\n"
                  f"🔗 {run_url}"
              )
              sys.exit(1)

          except Exception as exc:
              alert(
                  "🚨 RECOVERY SYSTEM ERROR",
                  f"حدث خطأ غير متوقع.\n"
                  f"نوع الخطأ: {type(exc).__name__}\n"
                  f"التفاصيل: {str(exc)[:800]}\n"
                  f"Run ID: {run_id}"
              )
              sys.exit(1)

          PY
